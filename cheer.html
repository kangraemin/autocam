<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>응원 링크 예시</title>
<style>
  :root { --bg:#f3f1ec; --fg:#1e2328; --mut:#6a6a6a; --line:#d8d4cb; --acc:#d2451e; --blue:#2f5d8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; word-break:keep-all; }
  main { max-width:430px; margin:0 auto; padding:0 16px 30px; }
  .ex { background:#fff1c9; color:#7a5a00; font-size:13px; font-weight:700; padding:8px 12px; margin:0 -16px 0; text-align:center; }
  .top { background:var(--fg); color:#fff; margin:0 -16px; padding:18px 18px 16px; }
  .top .city { font-size:13px; color:#f0a27f; font-weight:700; }
  .top h1 { font-size:22px; margin:2px 0 0; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:12px; }
  .ev { font-size:13px; color:var(--mut); }
  .sc { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:8px; text-align:center; }
  .sc .tm { font-weight:800; font-size:16px; }
  .sc .tm small { display:block; font-weight:600; font-size:12px; color:var(--mut); }
  .sc .n { font-size:34px; font-weight:900; letter-spacing:.02em; }
  video.clip { display:block; margin:12px auto 0; height:min(62vh,600px); max-height:none; width:auto; max-width:100%; aspect-ratio:9/16; background:#111; padding:0; }
  .cliplab { font-size:12px; color:var(--mut); margin-top:6px; text-align:center; }
  .clip { margin-top:12px; aspect-ratio:9/16; max-height:330px; width:100%; border-radius:10px; background:repeating-linear-gradient(135deg,#2a2e33 0 14px,#30353b 14px 28px); color:#cfcac0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; font-size:13px; }
  ul { list-style:none; padding:0; margin:8px 0 0; }
  li { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:14px; }
  li:first-child { border-top:none; }
  li b { font-variant-numeric:tabular-nums; }
  .cheer { display:flex; gap:8px; margin-top:12px; }
  .cheer button { flex:1; padding:11px; border-radius:10px; border:none; font:inherit; font-weight:800; color:#fff; background:var(--acc); }
  .cheer button.b { background:var(--blue); }
  .cnt { text-align:center; font-size:13px; color:var(--mut); margin-top:6px; }
  p.note { font-size:12.5px; color:var(--mut); }
</style>
</head>
<body>
<main>
  <div class="ex">예시 화면 · 공유 서버 없이 링크를 만든 기기에서만 열립니다</div>
  <div class="top"><div class="city" id="city"></div><h1 id="title">응원 링크</h1></div>
  <div class="card">
    <div class="ev" id="ev"></div>
    <div class="sc"><div class="tm" id="ta"></div><div class="n" id="score">0 : 0</div><div class="tm" id="tb"></div></div>
    <div id="clipBox"><div class="clip">이 경기에는 아직 올린 하이라이트가 없습니다</div></div>
  </div>
  <div class="card">
    <div class="ev">득점 기록</div>
    <ul id="goals"></ul>
  </div>
  <div class="card">
    <div class="ev">응원 보내기 (이 기기 안에서만 셉니다)</div>
    <div class="cheer"><button id="ca"></button><button id="cb" class="b"></button></div>
    <div class="cnt" id="cnt">0 : 0</div>
  </div>
  <p class="note">주소(#) 뒤에 팀 이름·점수·득점 시각과 클립 파일 이름이 들어 있습니다. 이 페이지는 아무 데이터도 서버로 보내지 않습니다.</p>
</main>
<script>
const q = new URLSearchParams(location.hash.slice(1)), $ = id => document.getElementById(id);
const g = (k, d) => q.get(k) || d;
const a = g('a', '수원시'), b = g('b', '성남시'), ta = g('ta', 'A팀'), tb = g('tb', 'B팀');
const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
$('city').textContent = `${a} · ${b} 응원 링크`;
$('title').textContent = `${a} 대 ${b}`;
$('ev').textContent = g('e', '경기');
$('ta').innerHTML = `${ta}<small>${a}</small>`; $('tb').innerHTML = `${tb}<small>${b}</small>`;
$('score').textContent = g('s', '0-0').replace('-', ' : ');
const v = q.get('v');
if (v && /^samples\/[\w-]+\.mp4$/.test(v)) $('clipBox').innerHTML = `<video class="clip" src="${v}" autoplay muted loop playsinline controls></video><div class="cliplab">득점 하이라이트 (무인 캠 세로 클립)</div>`;
const goals = (q.get('g') || '').split(',').filter(Boolean);
let sa = 0, sb = 0;
$('goals').innerHTML = goals.length ? goals.map(x => { const A = x[0] === 'A'; A ? sa++ : sb++; return `<li><span>${A ? ta : tb} 득점</span><b>${fmt(+x.slice(1))} · ${sa}:${sb}</b></li>`; }).join('') : '<li>아직 득점 기록이 없습니다</li>';
let c = [0, 0];
$('ca').textContent = `${a} 응원`; $('cb').textContent = `${b} 응원`;
$('ca').onclick = () => { c[0]++; $('cnt').textContent = c.join(' : '); };
$('cb').onclick = () => { c[1]++; $('cnt').textContent = c.join(' : '); };
</script>
</body>
</html>
